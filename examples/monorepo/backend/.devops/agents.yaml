# backend/.devops/agents.yaml
#
# Commands AI agents may run via `devops agents <command>`. Same schema as
# commands.yaml; only list what works in a sandbox (no TTY prompts, no host
# setup like mkcert -install or /etc/hosts edits, no secret decryption).

test:
  description: PHPUnit in app
  app:
    - php artisan test

lint:
  description: PHP_CodeSniffer and PHPStan
  app:
    - ./vendor/bin/phpcs
    - ./vendor/bin/phpstan analyse

migrate:
  app:
    - script: php artisan migrate --force
      priority: 10
