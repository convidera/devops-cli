# Reusable workflow: PR comment for a change in the git-secret store: which key of which decrypted file
# changed, plus the `git secret whoknows` access list. Only key names are reported, never values. It reveals
# the secrets of the PR head and of its base on the runner to compare them, and posts nothing but names.
# It posts no comment when nothing changed, and removes its earlier comment when a later push leaves nothing.
#
# Call it from a pull_request workflow of a repo that uses git-secret:
#
#   secret-changes:
#     uses: convidera/devops-cli/.github/workflows/secret-changes.yml@v0.2.4
#     permissions:
#       contents: read
#       pull-requests: write
#     secrets:
#       GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
#
# See docs/secret-changes.md.
name: Secret changes

on:
  workflow_call:
    inputs:
      runner:
        description: runs-on label of the runner
        type: string
        default: gha-runners-convidera-xs
    secrets:
      GPG_PRIVATE_KEY:
        description: Private key that can decrypt the repo's git-secret files
        required: true

jobs:
  secret-changes:
    name: Secret changes
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install git-secret
        shell: bash
        run: |
          if ! command -v git-secret &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y git-secret
          fi

      - name: Import the GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Reveal PR secrets
        shell: bash
        run: git secret reveal -f

      - name: Save the PR versions
        shell: bash
        run: |
          mkdir -p /tmp/pr-secrets
          while IFS=: read -r path _; do
            if [ -f "$path" ]; then
              mkdir -p "/tmp/pr-secrets/$(dirname "$path")"
              cp "$path" "/tmp/pr-secrets/$path"
            fi
          done < .gitsecret/paths/mapping.cfg
          git secret whoknows > /tmp/pr-secrets/whoknows.txt 2>/dev/null || true
          cp .gitsecret/paths/mapping.cfg /tmp/pr-secrets/mapping.cfg

      - name: Checkout base
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          clean: true
          fetch-depth: 0

      - name: Reveal base secrets
        shell: bash
        run: git secret reveal -f

      - name: Save the base versions
        shell: bash
        run: |
          mkdir -p /tmp/base-secrets
          while IFS=: read -r path _; do
            if [ -f "$path" ]; then
              mkdir -p "/tmp/base-secrets/$(dirname "$path")"
              cp "$path" "/tmp/base-secrets/$path"
            fi
          done < .gitsecret/paths/mapping.cfg
          git secret whoknows > /tmp/base-secrets/whoknows.txt 2>/dev/null || true
          cp .gitsecret/paths/mapping.cfg /tmp/base-secrets/mapping.cfg

      - name: Compare and build the report
        id: report
        shell: bash
        run: |
          # The runner shell is `bash -eo pipefail`, so every grep that may find nothing needs a
          # guard, and the loop bodies use `if` rather than `[ ... ] && ...`.
          keys() {
            # Only `NAME=` lines are keys. The last line of a wrapped base64 value (`...==`) follows a long line and
            # must not leak a fragment of the value as a key name.
            awk '
              /^[[:space:]]*#/ || /^[[:space:]]*$/ { prev = 0; next }
              prev >= 60 && /^[A-Za-z0-9+\/]+={1,2}$/ { prev = length($0); next }
              /^[A-Za-z_][A-Za-z0-9_.-]*=/ { split($0, kv, "="); print kv[1] }
              { prev = length($0) }
            ' "$1" | sort || true
          }
          count() {
            printf '%s\n' "$1" | grep -c . || true
          }
          list() {
            while IFS= read -r key; do
              if [ -n "$key" ]; then
                report+="- \`$key\`"$'\n'
              fi
            done <<< "$1"
          }

          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          report=""

          for file in $changed; do
            case "$file" in
              *.secret) ;;
              *) continue ;;
            esac
            path="${file%.secret}"
            pr="/tmp/pr-secrets/$path"
            base="/tmp/base-secrets/$path"

            # A .secret that only got re-encrypted has nothing to report.
            if [ ! -f "$pr" ] && [ ! -f "$base" ]; then
              continue
            fi

            if [ ! -f "$base" ]; then
              report+=$'\n'"<details>"$'\n'"<summary><code>$path</code> — $(count "$(keys "$pr")") key(s), file added</summary>"$'\n'
              list "$(keys "$pr")"
              report+="</details>"$'\n'
              continue
            fi

            if [ ! -f "$pr" ]; then
              report+=$'\n'"<details>"$'\n'"<summary><code>$path</code> — $(count "$(keys "$base")") key(s), file removed</summary>"$'\n'
              list "$(keys "$base")"
              report+="</details>"$'\n'
              continue
            fi

            base_keys=$(keys "$base")
            pr_keys=$(keys "$pr")
            added=$(comm -13 <(printf '%s\n' "$base_keys") <(printf '%s\n' "$pr_keys"))
            removed=$(comm -23 <(printf '%s\n' "$base_keys") <(printf '%s\n' "$pr_keys"))
            common=$(comm -12 <(printf '%s\n' "$base_keys") <(printf '%s\n' "$pr_keys"))

            modified=""
            while IFS= read -r key; do
              if [ -z "$key" ]; then
                continue
              fi
              base_val=$(grep -m1 "^$key=" "$base" | cut -d'=' -f2- || true)
              pr_val=$(grep -m1 "^$key=" "$pr" | cut -d'=' -f2- || true)
              if [ "$base_val" != "$pr_val" ]; then
                modified+="$key"$'\n'
              fi
            done <<< "$common"

            added_count=$(count "$added")
            removed_count=$(count "$removed")
            modified_count=$(count "$modified")
            total=$((added_count + removed_count + modified_count))
            if [ "$total" -eq 0 ]; then
              continue
            fi

            summary=""
            if [ "$added_count" -gt 0 ]; then
              summary="${summary}${added_count} added, "
            fi
            if [ "$removed_count" -gt 0 ]; then
              summary="${summary}${removed_count} removed, "
            fi
            if [ "$modified_count" -gt 0 ]; then
              summary="${summary}${modified_count} modified (value changed), "
            fi
            summary="${summary%, }"

            report+=$'\n'"<details>"$'\n'"<summary><code>$path</code> — $total change(s): $summary</summary>"$'\n'
            if [ -n "$added" ]; then
              report+=$'\n'"**Added keys:**"$'\n'
              list "$added"
            fi
            if [ -n "$removed" ]; then
              report+=$'\n'"**Removed keys:**"$'\n'
              list "$removed"
            fi
            if [ -n "$modified" ]; then
              report+=$'\n'"**Modified keys (value changed):**"$'\n'
              list "$modified"
            fi
            report+="</details>"$'\n'
          done

          if [ -f /tmp/base-secrets/whoknows.txt ] && [ -f /tmp/pr-secrets/whoknows.txt ]; then
            added_users=$(comm -13 <(sort /tmp/base-secrets/whoknows.txt) <(sort /tmp/pr-secrets/whoknows.txt))
            removed_users=$(comm -23 <(sort /tmp/base-secrets/whoknows.txt) <(sort /tmp/pr-secrets/whoknows.txt))
            if [ -n "$added_users" ] || [ -n "$removed_users" ]; then
              report+=$'\n'"### Access list (\`git secret whoknows\`)"$'\n'
              if [ -n "$added_users" ]; then
                report+=$'\n'"**Added:**"$'\n'
                list "$added_users"
              fi
              if [ -n "$removed_users" ]; then
                report+=$'\n'"**Removed:**"$'\n'
                list "$removed_users"
              fi
            fi
          fi

          added_tracked=$(comm -13 <(cut -d':' -f1 /tmp/base-secrets/mapping.cfg | sort) <(cut -d':' -f1 /tmp/pr-secrets/mapping.cfg | sort))
          removed_tracked=$(comm -23 <(cut -d':' -f1 /tmp/base-secrets/mapping.cfg | sort) <(cut -d':' -f1 /tmp/pr-secrets/mapping.cfg | sort))
          if [ -n "$added_tracked" ] || [ -n "$removed_tracked" ]; then
            report+=$'\n'"### Tracked secret files"$'\n'
            if [ -n "$added_tracked" ]; then
              report+=$'\n'"**Newly tracked:**"$'\n'
              list "$added_tracked"
            fi
            if [ -n "$removed_tracked" ]; then
              report+=$'\n'"**No longer tracked:**"$'\n'
              list "$removed_tracked"
            fi
          fi

          # Nothing to report (no key change, or only a re-encrypted .secret): no comment.
          if [ -z "$report" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          full_report="## 🔐 Secret changes detected"$'\n'"$report"
          echo "$full_report" > /tmp/secret-report.md
          cat /tmp/secret-report.md

      - name: Comment on the PR
        if: steps.report.outputs.has_changes == 'true'
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: /tmp/secret-report.md
          comment-tag: secret-changes

      # A later push can remove the last change; drop the comment from the earlier push.
      - name: Remove the outdated comment
        if: steps.report.outputs.has_changes != 'true'
        uses: thollander/actions-comment-pull-request@v3
        with:
          mode: delete
          comment-tag: secret-changes
