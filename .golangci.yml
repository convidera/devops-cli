version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/convidera/devops-parallel-runner

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
